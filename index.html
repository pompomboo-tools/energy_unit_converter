<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- maximum-scale=1.0 を追加してズームを防止 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">

<title>熱量換算</title>

<!-- 外部CSSファイルの読み込み -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header-container">
  <h2>熱量換算</h2>
  <button type="button" class="clear-btn" id="clear-btn">
    クリア
  </button>
</div>

<div class="panel">
  <div class="content-area">

    <div class="converter-wrapper">

      <!-- 換算前 -->
      <div class="box">
        <div class="box-title">換算前</div>

        <div class="row">
          <label class="label" for="base-mj">熱量</label>
          <input
            type="text"
            id="base-mj"
            class="number-input"
            placeholder="数値入力"
            inputmode="decimal"
            autocomplete="off"
          >
          <span>MJ</span>
        </div>

        <div class="row">
          <label class="label" for="base-m3">使用量</label>
          <input
            type="text"
            id="base-m3"
            class="number-input"
            placeholder="数値入力"
            inputmode="decimal"
            autocomplete="off"
          >
          <span>m³</span>
        </div>
      </div>

      <!-- 中央矢印（幅広の太いSVG矢印） -->
      <div class="arrow-area">
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <path d="M1 6h11V1.5L23 12l-11 10.5V18H1V6z"/>
        </svg>
      </div>

      <!-- 換算後 -->
      <div class="box">
        <div class="box-title">換算後</div>

        <div class="row">
          <label class="label" for="target-mj">熱量</label>
          <input
            type="text"
            id="target-mj"
            class="number-input"
            placeholder="数値入力"
            inputmode="decimal"
            autocomplete="off"
          >
          <span>MJ</span>
        </div>

        <div class="row">
          <label class="label" for="target-m3">使用量</label>
          <input
            type="text"
            id="target-m3"
            class="number-input"
            placeholder="数値入力"
            inputmode="decimal"
            autocomplete="off"
          >
          <span>m³</span>
        </div>
      </div>

    </div>

    <!-- 設定エリア -->
    <div class="settings-container">
      
      <!-- 計算モード切替 -->
      <div class="setting-row">
        <span class="setting-label">計算項目：</span>
        <div class="setting-options">
          <label>
            <input type="radio" name="calc-mode" value="m3" checked>
            換算後の「使用量」
          </label>
          <label>
            <input type="radio" name="calc-mode" value="mj">
            換算後の「熱量」
          </label>
        </div>
      </div>

      <hr style="width: 100%; border: 0; border-top: 1px solid #ddd; margin: 0;">

      <!-- 端数処理 -->
      <div class="setting-row">
        <span class="setting-label">端数処理：</span>
        <div class="setting-options">
          <label>
            <input type="radio" name="round" value="round" checked>
            四捨五入
          </label>
          <label>
            <input type="radio" name="round" value="floor">
            切り捨て
          </label>
          <label>
            <input type="radio" name="round" value="ceil">
            切り上げ
          </label>
        </div>
      </div>

    </div>

  </div>
</div>

<!-- 外部JSファイルの読み込み -->
<script src="script.js"></script>
</body>
</html>
